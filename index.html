<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eccoia — IA Avançada</title>

    <!-- Estilos básicos -->
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #111;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            border-bottom: 1px solid #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background-color: #00c8ff;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #0099cc;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid #222;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        Eccoia — Inteligência Artificial Moderna
    </header>

    <div class="container">
        <h1>Bem-vindo à Eccoia</h1>
        <p>
            Uma inteligência artificial avançada, criada para oferecer ajuda rápida, eficiente e moderna.
            Aqui você poderá acessar interações, atualizações e novidades.
        </p>

        <a href="#" class="btn">Iniciar</a>
    </div>

    <footer>
        © 2025 Eccoia — Todos os direitos reservados.
    </footer>

</body>
</html>
