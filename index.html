<script>
async function enviar() {
    const pergunta = document.getElementById("pergunta").value;
    const API_KEY = "AIzaSyAIf-EvxFBc2IPoWDKUvgX8d3umUKOq_c4"; // sua chave

    if (!pergunta.trim()) return;

    const chat = document.getElementById("chat-box");

    // Mostrar mensagem do usuário
    chat.innerHTML += `<div class='msg-user'>${pergunta}</div>`;
    chat.scrollTop = chat.scrollHeight;

    document.getElementById("pergunta").value = "";

    // Mensagem de carregamento
    const loadId = "load" + Math.random();
    chat.innerHTML += `<div id="${loadId}" class='msg-bot loading'>Eccoia está pensando...</div>`;
    chat.scrollTop = chat.scrollHeight;

    const req = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [
                    {
                        parts: [{ text: pergunta }]
                    }
                ]
            })
        }
    );

    const data = await req.json();

    document.getElementById(loadId).remove();

    const resposta =
        data?.candidates?.[0]?.content?.parts?.[0]?.text ||
        "⚠️ Erro ao gerar resposta.";

    chat.innerHTML += `<div class='msg-bot'>${resposta}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>
