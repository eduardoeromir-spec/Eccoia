<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eccoia • IA Minimalista</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f5f5f5;
        color: #222;
        font-family: "Inter", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 95%;
        max-width: 600px;
        background: white;
        padding: 25px;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(0,0,0,0.06);
    }

    h2 {
        text-align: center;
        margin-top: 0;
        font-weight: 600;
        font-size: 24px;
    }

    #chat-box {
        background: #fafafa;
        border-radius: 10px;
        padding: 15px;
        height: 260px;
        overflow-y: auto;
        font-size: 15px;
        border: 1px solid #ddd;
    }

    .msg-user {
        text-align: right;
        margin: 10px 0;
        color: #333;
    }

    .msg-bot {
        text-align: left;
        margin: 10px 0;
        color: #555;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 15px;
    }

    button {
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        border: none;
        background: #222;
        color: white;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #000;
    }

    .loading {
        text-align: center;
        padding: 10px;
        color: #999;
        font-style: italic;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Eccoia</h2>

    <div id="chat-box"></div>

    <input id="pergunta" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter'){enviar()}">
    <button onclick="enviar()">Enviar</button>
</div>

<script>
async function enviar() {
    const pergunta = document.getElementById("pergunta").value;
    if (!pergunta.trim()) return;

    const chat = document.getElementById("chat-box");

    // Mostra mensagem do usuário
    chat.innerHTML += `<div class='msg-user'>${pergunta}</div>`;
    chat.scrollTop = chat.scrollHeight;

    document.getElementById("pergunta").value = "";

    // Mostra "Carregando..."
    const loadId = "load" + Math.random();
    chat.innerHTML += `<div id="${loadId}" class='loading'>Eccoia está pensando...</div>`;
    chat.scrollTop = chat.scrollHeight;

    // Gemini
    const API_KEY = AIzaSyAIf-EvxFBc2IPoWDKUvgX8d3umUKOq_c4; // 

    const req = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + API_KEY,
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ parts: [{ text: pergunta }] }]
            })
        }
    );

    const data = await req.json();

    // Remove o "Carregando..."
    document.getElementById(loadId).remove();

    const resposta = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Erro ao gerar resposta.";

    // Mostra resposta
    chat.innerHTML += `<div class='msg-bot'>${resposta}</div>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
